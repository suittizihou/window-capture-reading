codecov:
  require_ci_to_pass: false
  notify:
    wait_for_ci: false

coverage:
  status:
    project:
      default:
        # Lower coverage target because hardware-dependent tests are excluded.
        target: 50%
        threshold: 5%
    patch:
      default:
        target: 50%
        threshold: 5%

comment:
  layout: "diff, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  # Exclude screen capture and external-system-dependent code.
  - "src/main.py"
  - "src/services/window_capture.py"