name: リリースタグ作成

# リポジトリへの書き込み権限を追加
permissions:
  contents: write

on:
  # 他のワークフローからの呼び出しを許可
  workflow_call:
    inputs:
      tag_increment:
        description: 'バージョン増分タイプ'
        required: false
        type: string
        default: 'patch'
      prerelease:
        description: 'プレリリースとして作成'
        required: false
        type: boolean
        default: false
      prerelease_id:
        description: 'プレリリース識別子（beta/alpha/rc）'
        required: false
        type: string
        default: 'beta'
    outputs:
      tag_name:
        description: '作成されたタグ名'
        value: ${{ jobs.create-tag.outputs.tag_name }}
      is_prerelease:
        description: 'プレリリースかどうか'
        value: ${{ jobs.create-tag.outputs.is_prerelease }}
      release_commit_sha:
        description: 'バージョン変更後のコミットSHA'
        value: ${{ jobs.create-tag.outputs.release_commit_sha }}


jobs:
  create-tag:
    runs-on: windows-latest
    # 環境を使用してアクセスを制限
    environment: release
    outputs:
      tag_name: ${{ steps.get_version.outputs.new_tag }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
      release_commit_sha: ${{ steps.update_version.outputs.commit_sha }}
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: GitとPowerShellの設定
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: 最新のタグとバージョン情報を取得
        id: get_version
        run: |
          # 最新のタグを取得
          $latestTag = git describe --tags --abbrev=0 2>$null || echo "v0.0.0"
          echo "latest_tag=$latestTag" >> $env:GITHUB_OUTPUT

          # v1.2.3 形式からバージョン部分を抽出
          if ($latestTag -match "v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+)?") {
            $major = [int]$Matches[1]
            $minor = [int]$Matches[2]
            $patch = [int]$Matches[3]

            # 増分タイプに応じてバージョンを更新
            switch ("${{ inputs.tag_increment }}") {
              "major" {
                $major++
                $minor = 0
                $patch = 0
              }
              "minor" {
                $minor++
                $patch = 0
              }
              "patch" {
                $patch++
              }
            }

            $newTag = "v${major}.${minor}.${patch}"
          }
          else {
            $newTag = "v0.1.0"
          }

          # プレリリース指定がある場合は識別子を付与
          $isPrerelease = [System.Convert]::ToBoolean("${{ inputs.prerelease }}")

          if ($isPrerelease) {
            $prelId = "${{ inputs.prerelease_id }}"
            $newTag = "${newTag}-${prelId}"
          }

          echo "新しいタグ: $newTag"
          echo "new_tag=$newTag" >> $env:GITHUB_OUTPUT
          echo "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT
      
      - name: タグの存在確認
        id: check_tag
        run: |
          $tagToCheck = "${{ steps.get_version.outputs.new_tag }}"
          $tagExists = git tag -l "$tagToCheck"
          
          if ($tagExists) {
            echo "tag_exists=true" >> $env:GITHUB_OUTPUT
            echo "警告：タグ '$tagToCheck' は既に存在します"
          } else {
            echo "tag_exists=false" >> $env:GITHUB_OUTPUT
          }
      
      - name: タグが既に存在する場合のエラー
        if: steps.check_tag.outputs.tag_exists == 'true'
        run: |
          echo "::error::タグ '${{ steps.get_version.outputs.new_tag }}' は既に存在します。別のタグ名を選択してください。"
          exit 1
      
      - name: pyproject.toml のバージョン更新
        id: update_version
        if: steps.check_tag.outputs.tag_exists == 'false'
        shell: pwsh
        run: |
            $tag = "${{ steps.get_version.outputs.new_tag }}"

            # vX.X.X -> X.X.X
            $version = $tag.TrimStart('v')

            Write-Host "pyproject.toml のバージョンを $version に更新します"

            $content = Get-Content "pyproject.toml" -Raw -Encoding UTF8

            $content = $content -replace `
              '(?m)^version\s*=\s*"[^"]+"', `
              "version = `"$version`""

            Set-Content `
              -Path "pyproject.toml" `
              -Value $content `
              -Encoding UTF8

            Write-Host "更新後:"
            Select-String `
              -Path "pyproject.toml" `
              -Pattern '^version\s*='

            git add pyproject.toml

            # 実際に変更された場合のみcommit
            git diff --cached --quiet

            if ($LASTEXITCODE -ne 0) {
              git commit -m "Bump version to $version"
              git push origin main
            }
            else {
              Write-Host "pyproject.toml は既に $version です"
            }

            $commitSha = git rev-parse HEAD

            Write-Host "リリース対象コミット: $commitSha"
            echo "commit_sha=$commitSha" >> $env:GITHUB_OUTPUT

      - name: タグ名の確定
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          $tagToCreate = "${{ steps.get_version.outputs.new_tag }}"
          $isPrerelease = "${{ steps.get_version.outputs.is_prerelease }}" -eq "True"

          echo "使用するタグ名: $tagToCreate"
          if ($isPrerelease) {
            echo "このタグはプレリリースとして識別されます"
          }
          echo "タグは release-exe.yml ワークフローでビルド成功後に作成されます"
      
      - name: 結果出力
        run: |
          echo "最新のタグ: ${{ steps.get_version.outputs.latest_tag }}"
          echo "使用するタグ: ${{ steps.get_version.outputs.new_tag }}"
          $isPrerelease = "${{ steps.get_version.outputs.is_prerelease }}" -eq "True"
          if ($isPrerelease) {
            echo "タイプ: プレリリース"
          } else {
            echo "タイプ: 正式リリース"
          }
          echo "これにより、release-exe.ymlワークフローが自動的にトリガーされます。"
          echo "タグはビルド成功後に作成されます。"
          echo "GitHubのActionsタブでリリースビルドの進行状況を確認できます。"